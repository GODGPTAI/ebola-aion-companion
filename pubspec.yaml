
name: ebola_aion_companion
description: EBOLA AION companion app for G1-G4 wearable models.
publish_to: 'none'
version: 0.1.2+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:

  moyoung_glasses_ble_plugin: 1.4.0
  webview_flutter: ^4.10.0
  flutter:
    sdk: flutter
  ebola_wearable_sdk:
    path: packages/ebola_wearable_sdk
  url_launcher: ^6.3.1
  flutter_blue_plus: ^1.35.5
  speech_to_text: ^7.5.0
  permission_handler: ^11.3.1
  video_player: 2.9.2 # local imported glass video preview

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ebola_home_brand.png
    - assets/images/EBOLA.png
    - assets/images/g3.png
    - assets/images/g4.png
